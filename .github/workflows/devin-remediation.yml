name: Devin Remediation

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  remediate:
    if: github.event.label.name == 'devin-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out automation code
        uses: actions/checkout@v4
        with:
          sparse-checkout: devin-remediation-demo
          sparse-checkout-cone-mode: false

      - name: Build automation image
        run: docker build -t devin-remediation-demo devin-remediation-demo

      - name: Launch Devin remediation session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLL_TIMEOUT_SECONDS: ${{ vars.POLL_TIMEOUT_SECONDS }}
        run: |
          docker run --rm \
            -e DEVIN_API_KEY \
            -e GITHUB_TOKEN \
            -e GITHUB_EVENT_PATH=/event.json \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e POLL_TIMEOUT_SECONDS \
            -v "${{ github.event_path }}:/event.json:ro" \
            devin-remediation-demo
        # Optional repo variable POLL_TIMEOUT_SECONDS: seconds to poll the session
        # for a pull-request link before the job exits.
