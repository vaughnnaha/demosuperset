name: Devin Remediation Automation

on:
  push:
    branches: [master]
    paths:
      - devin-remediation-demo/**
      - .github/workflows/devin-remediation*.yml
  pull_request:
    paths:
      - devin-remediation-demo/**
      - .github/workflows/devin-remediation*.yml

permissions:
  contents: read

concurrency:
  group: devin-remediation-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devin-remediation-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt && pip install pytest

      - name: Unit tests
        run: pytest tests/ -v

      - name: Lint
        run: pip install ruff && ruff check src tests && ruff format --check src tests

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: Build image
        run: docker build -t devin-remediation-demo .

      - name: Reject a wrong-label event without calling any API
        env:
          DEVIN_API_KEY: not-a-real-key
        run: |
          python - <<'PY'
          import json, pathlib
          event = json.loads(pathlib.Path("sample_event.json").read_text())
          event["label"]["name"] = "bug"
          pathlib.Path("/tmp/wrong-label.json").write_text(json.dumps(event))
          PY
          GITHUB_EVENT_PATH=/tmp/wrong-label.json python src/main.py
